[project]
name = "ubiquitous-memory"
version = "0.1.0"
description = "Research assistant over a paper collection: cited answers, conversation memory, literature briefs"
requires-python = ">=3.12,<3.13"
dependencies = [
    "chromadb>=1.0",
    "httpx>=0.27",
    "numpy>=1.26",
    "pymupdf>=1.24",
    "streamlit>=1.40",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/research", "src/ragchat", "src/shared"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: calls a real chat and embedding model (needs LLM_BASE_URL, LLM_API_KEY, LLM_MODEL and EMBED_MODEL) and the indexed collection"]
addopts = "-m 'not live'"
